<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"> <head>
    <meta charset="UTF-8">
    <title>FAQ 고객센터 - 타임리프</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f9f9f9; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border-bottom: 1px solid #eee; padding: 12px; text-align: center; }
        .form-section { background: #eee; padding: 20px; margin-bottom: 30px; border-radius: 8px; }
    </style>
</head>
<body>

<script>
    const countButton = document.getElementById('user-count-button');
    const countResult = document.getElementById('user-count-result');

    countButton.addEventListener('click', async () => {
        countButton.disabled = true;
        countResult.textContent = '조회 중입니다...';

        try {
            // 1. 페이지 이동 없이 컨트롤러에 GET 요청을 보낸다.
            const response = await fetch(countButton.dataset.url, {
                headers: { 'Accept': 'application/json' }
            });
            // fetch는 HTTP 4xx/5xx 응답을 자동으로 예외 처리하지 않는다.
            if (!response.ok) {
                throw new Error(`회원 수 조회 실패: HTTP ${response.status}`);
            }

            // 2. JSON 응답 { "count": 3 }을 자바스크립트 객체로 변환한다.
            const data = await response.json();
            // 3. HTML을 삽입하지 않고 텍스트만 갱신한다.
            countResult.textContent = `현재 회원 수는 ${data.count}명입니다.`;
        } catch (error) {
            countResult.textContent = '회원 수를 불러오지 못했습니다. 다시 시도해 주세요.';
            console.error(error);
        } finally {
            countButton.disabled = false;
        }
    });
</script>

	<div class ="container">
		<h1>관리자 페이지</h1>
		<!-- 기존 목록은 그대로 두고, 회원 수만 AJAX로 조회하는 예제 -->
		<button type="button" id="user-count-button"
		        th:data-url="@{/admin/user-count}">회원 수 확인</button>
		<p id="user-count-result" role="status" aria-live="polite"></p>
	
	
<table>
	<thead>
	 <tr>
	 	<th>번호</th>
	 	<th>ID</th>
	 	<th>회원 이름</th>
	 	<th>이메일</th>
	 	<th>직책</th>
	 	<th>생성일자</th>
	 	<th>변경일자</th>
	 </tr>
	</thead>
	<tbody> 
	  <tr th:each = "user, stat : ${users}">
	  	<td th:text = "${stat.count}">1</td>
	  	<td th:text = "${user.id}">ID</td>
	  	<td th:text = "${user.name}">회원 이름</td>
	  	<td th:text = "${user.email}">이메일</td>
	  	<td th:text = "${user.role}">직책</td>
	  	<td th:text = "${#temporals.format(user.createdAt, 'yyyy-MM-dd')}">생성일자</td>
	  	<td th:text = "${user.changeDt}">변경일자</td>
	  </tr>
	</tbody>
</table>
	</div>
	
</body>
</html>
