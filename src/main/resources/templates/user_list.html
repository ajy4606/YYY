<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 목록</title>
    <style>
        table { width: 50%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
        th { background-color: #eee; }
        
        /* 🔍 검색창 구역 디자인 추가 */
        .search-container { width: 50%; margin-bottom: 15px; text-align: left; }
        .search-select, .search-input { padding: 6px; font-size: 14px; }
        .search-input { width: 200px; }
        .btn-search { padding: 6px 12px; background-color: #555; color: white; border: none; cursor: pointer; }
        .btn-search:hover { background-color: #333; }
        
        .navigation-container { width: 50%; margin-top: 15px; text-align: right; }
    </style>
</head>
<body>
    <h1>가입된 회원 목록</h1>

    <div class="search-container">
		<form method="get">
		    <select name="searchType" class="search-select">
				<option value="all" th:selected="${param.searchType == 'all'}">전체</option>
				<option value="id" th:selected="${param.searchType == 'id'}">회원번호</option>
		        <option value="name" th:selected="${param.searchType == 'name'}">이름</option>
		    </select>
		    <input type="text" name="keyword" class="search-input" th:value="${param.keyword}">
		    <button type="submit" class="btn-search">검색</button>
		</form>
    </div>

    <p th:if="${#lists.isEmpty(userList)}">현재 가입된 회원이 없거나 검색 결과가 없습니다.</p>

    <table th:unless="${#lists.isEmpty(userList)}">
        <thead>
            <tr>
                <th>회원번호(ID)</th>
                <th>이름</th>
                <th>이메일</th>
                <th>권한</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${userList}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.name}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.role}"></td>
            </tr>
        </tbody>
    </table>

    <div class="navigation-container">
        <button type="button" class="btn btn-primary" 
                th:onclick="|location.href='@{/login}'|">로그인 페이지로</button>
    </div>
	<div class="navigation-container">
	    <button type="button" class="btn btn-primary" 
	            th:onclick="|location.href='@{/main}'|">메인페이지</button>
	</div>
</body>
</html>
