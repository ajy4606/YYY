<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이메일 변경</title>
    <style>
        .pw-change-wrapper {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --error-color: #ef4444;
            --cancel-bg: #f3f4f6;
            --cancel-hover: #e5e7eb;
            
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            padding: 20px;
            max-width: 460px; 
            margin: 40px auto; 
        }

        .pw-change-wrapper * {
            box-sizing: border-box;
        }

        .pw-change-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            padding: 32px;
        }

        .pw-change-wrapper h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .pw-change-wrapper .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }

        .pw-change-wrapper .error-box {
            background-color: #fef2f2;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            color: var(--error-color);
            font-size: 14px;
            font-weight: 500;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pw-change-wrapper .form-group {
            margin-bottom: 18px;
        }

        .pw-change-wrapper .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .pw-change-wrapper .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            background-color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .pw-change-wrapper .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .pw-change-wrapper .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 28px;
        }

        .pw-change-wrapper button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .pw-change-wrapper .btn-submit {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .pw-change-wrapper .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .pw-change-wrapper .btn-cancel {
            background-color: var(--cancel-bg);
            color: var(--text-main);
        }

        .pw-change-wrapper .btn-cancel:hover {
            background-color: var(--cancel-hover);
        }
    </style>
</head>
<body>

    <div class="pw-change-wrapper">
        <div class="pw-change-card">
            <h2>이메일 변경</h2>
            <p class="subtitle">새롭게 사용할 이메일 주소를 입력해주세요.</p>

            <div th:if="${errorMessage}" class="error-box">
                <span>⚠</span>
                <span th:text="${errorMessage}">에러 메시지 영역</span>
            </div>

            <form th:action="@{/users/mypage/chg_email}" method="post">
                <div class="form-group">
                    <label>새 이메일 주소</label>
                    <!-- 💡 type="email"로 설정하면 브라우저가 @과 도메인이 들어간 형식인지 수동 검증해줍니다 -->
                    <input type="email" name="email" placeholder="example@domain.com" required>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-submit">이메일 변경</button>
                    <button type="button" class="btn-cancel" th:onclick="location.href=[[@{/users/mypage}]]">취소</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
