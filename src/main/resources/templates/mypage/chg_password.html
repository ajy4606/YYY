<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경</title>
    <style>
        .pw-change-wrapper {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --error-color: #ef4444;
            --cancel-bg: #f3f4f6;
            --cancel-hover: #e5e7eb;
            
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            padding: 20px;
            max-width: 460px; 
            margin: 40px auto; 
        }

        .pw-change-wrapper * {
            box-sizing: border-box;
        }

        .pw-change-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            padding: 32px;
        }

        .pw-change-wrapper h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .pw-change-wrapper .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }

        .pw-change-wrapper .error-box {
            background-color: #fef2f2;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            color: var(--error-color);
            font-size: 14px;
            font-weight: 500;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pw-change-wrapper .form-group {
            margin-bottom: 18px;
        }

        .pw-change-wrapper .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .pw-change-wrapper .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            background-color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .pw-change-wrapper .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .pw-change-wrapper .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 28px;
        }

        .pw-change-wrapper button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .pw-change-wrapper .btn-submit {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .pw-change-wrapper .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .pw-change-wrapper .btn-cancel {
            background-color: var(--cancel-bg);
            color: var(--text-main);
        }

        .pw-change-wrapper .btn-cancel:hover {
            background-color: var(--cancel-hover);
        }
    </style>
</head>
<body>

    <div class="pw-change-wrapper">
        <div class="pw-change-card">
            <h2>비밀번호 변경</h2>
            <p class="subtitle">안전한 서비스 이용을 위해 비밀번호를 변경해주세요.</p>

            <div th:if="${errorMessage}" class="error-box">
                <span>⚠</span>
                <span th:text="${errorMessage}">에러 메시지 영역</span>
            </div>

            <!-- 💡 변경 포인트 1: form 전송 시(onsubmit) 자바스크립트 함수가 검증하도록 지정 -->
            <form th:action="@{/users/mypage/chg_password}" method="post" onsubmit="return checkPasswordForm(this);">
                <div class="form-group">
                    <label>현재 비밀번호</label>
                    <input type="password" name="password" placeholder="현재 비밀번호를 입력하세요" required>
                </div>
                
                <div class="form-group">
                    <label>새 비밀번호</label>
                    <input type="password" name="newPassword" placeholder="새 비밀번호를 입력하세요" required>
                </div>

                <div class="form-group">
                    <label>새 비밀번호 확인</label>
                    <input type="password" name="confirmPassword" placeholder="새 비밀번호를 한 번 더 입력하세요" required>
                </div>

                <div class="button-group">
                    <!-- 💡 변경 포인트 2: disabled 제거! 언제나 클릭할 수 있게 열어둡니다. -->
                    <button type="submit" class="btn-submit">비밀번호 변경</button>
                    <button type="button" class="btn-cancel" th:onclick="|location.href='/users/mypage'|">취소</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 💡 전송 시점에 딱 한 번만 깔끔하게 비교하는 가벼운 로직 -->
    <script>
        function checkPasswordForm(form) {
            const newPw = form['newPassword'].value;
            const confirmPw = form['confirmPassword'].value;

            if (newPw !== confirmPw) {
                alert("새 비밀번호와 새 비밀번호 확인이 일치하지 않습니다.");
                form['confirmPassword'].focus();
                return false; // ❌ 전송을 취소하고 화면에 머무릅니다.
            }
            
            return true; //  서버로 데이터를 정상 전송합니다.
        }
    </script>
</body>
</html>
