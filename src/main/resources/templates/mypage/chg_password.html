<div style="width: 100%; text-align: left; animation: fadeIn 0.3s ease; max-width: 400px; margin: 0 auto;">
    
    <style>
        .form-title { font-size: 1.3rem; font-weight: bold; color: #212529; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #495057; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #dee2e6; border-radius: 6px; outline: none; font-size: 0.95rem; }
        .form-group input:focus { border-color: #17a2b8; }
        .btn-submit { width: 100%; padding: 11px; background: #17a2b8; color: white; border: none; border-radius: 6px; font-weight: 500; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #138496; }
        .btn-cancel { width: 100%; padding: 11px; background: none; color: #6c757d; border: 1px solid #dee2e6; border-radius: 6px; cursor: pointer; margin-top: 8px; text-align: center; font-size: 0.9rem; }
        .btn-cancel:hover { background: #f8f9fa; }
    </style>

    <h3 class="form-title">🔒 비밀번호 변경</h3>

    <form onsubmit="submitPassword(event)">
        <div class="form-group">
            <label>현재 비밀번호</label>
            <input type="password" id="currentPassword" placeholder="현재 비밀번호 입력" required>
        </div>
        <div class="form-group">
            <label>새 비밀번호</label>
            <input type="password" id="newPassword" placeholder="새 비밀번호 입력" required>
        </div>
        <div class="form-group">
            <label>새 비밀번호 확인</label>
            <input type="password" id="confirmPassword" placeholder="새 비밀번호 재입력" required>
        </div>

        <button type="submit" class="btn-submit">비밀번호 수정</button>
        <button type="button" class="btn-cancel" onclick="loadContent('/users/mypage')">취소</button>
    </form>

    <script>
        function submitPassword(event) {
            event.preventDefault();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // 자바스크립트 단 1차 유효성 검증
            if(newPassword !== confirmPassword) {
                alert('새 비밀번호와 확인 입력이 일치하지 않습니다.');
                return;
            }

            const formData = new URLSearchParams();
            formData.append('currentPassword', currentPassword);
            formData.append('newPassword', newPassword);

            fetch('/users/mypage/chg_password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
            .then(res => res.text())
            .then(result => {
                if(result === 'SUCCESS') {
                    alert('비밀번호가 안전하게 변경되었습니다.');
                    loadContent('/users/mypage');
                } else if(result === 'WRONG_PASSWORD') {
                    alert('현재 비밀번호가 일치하지 않습니다.');
                } else {
                    alert('변경 도중 오류가 발생했습니다.');
                }
            });
        }
    </script>
</div>
