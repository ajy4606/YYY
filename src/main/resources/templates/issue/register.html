<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>QA 과제(Issue) 등록</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        textarea { height: 150px; resize: vertical; }
        button { padding: 10px 15px; background-color: #0056b3; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h2>새 테스트 과제 등록</h2>

    <form th:action="@{/issues/register}" th:object="${issueRequest}" method="post">
        
        <div class="form-group">
            <label for="title">과제 제목</label>
            <input type="text" id="title" th:field="*{title}" placeholder="과제 제목을 입력하세요" required>
        </div>

        <div class="form-group">
            <label for="severity">중요도 (Severity)</label>
            <select id="severity" th:field="*{severity}">
                <option value="CRITICAL">Critical</option>
                <option value="HIGH">High</option>
                <option value="MEDIUM" selected>Medium</option>
                <option value="LOW">Low</option>
            </select>
        </div>

        <div class="form-group">
            <label for="assigneeId">담당자 (Assignee ID)</label>
            <input type="number" id="assigneeId" th:field="*{assigneeId}" placeholder="담당자 ID를 입력하세요">
        </div>

        <div class="form-group">
            <label for="description">상세 설명</label>
            <textarea id="description" th:field="*{description}" 
                      placeholder="E2E 관점의 테스트 시나리오, 개발자가 전달한 TC, 또는 OSS 및 온스크린 등 유관 부서와의 통합테스트 시나리오를 상세히 기재해주세요."></textarea>
        </div>

        <button type="submit">과제 등록</button>
        <button type="button" onclick="history.back()">취소</button>
    </form>

</body>
</html>
