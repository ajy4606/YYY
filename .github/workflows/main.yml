name: Build and publish image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ajy4606/yyy

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v6

      - name: Java 17 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Spring Boot JAR 빌드
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 GHCR 업로드
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ajy4606/yyy:latest
            ghcr.io/ajy4606/yyy:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Argo CD는 Git의 변경을 감지하므로, 새 이미지의 고유 SHA 태그를
      # Kubernetes 배포 파일에 기록하고 Git에 다시 반영한다.
      - name: Kubernetes 이미지 태그 갱신
        env:
          IMAGE: ghcr.io/ajy4606/yyy:sha-${{ github.sha }}
        run: |
          sed -i "s|image: ghcr.io/ajy4606/yyy:.*|image: ${IMAGE}|" k8s/deployment.yaml

          if git diff --quiet -- k8s/deployment.yaml; then
            echo "이미지 태그 변경 없음"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "chore(deploy): ${GITHUB_SHA} 배포 [skip ci]"
          git push
