apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sideproject
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ajy4606/YYY.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: sideproject
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
